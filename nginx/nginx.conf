server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. nginx resolves an upstream hostname ONCE at
    # startup and then caches that IP for the life of the process, which is a
    # trap every time `docker compose up -d` recreates the web container (any
    # change to its image, env or volumes does): the containers are renumbered,
    # nginx keeps dialling the old address, and the site 502s until nginx is
    # restarted. Worse, the stale address gets reused — on 2026-09-21 nginx was
    # proxying HTTP straight at Postgres, which just refuses the connection.
    # A `resolver` plus a *variable* in proxy_pass below defers resolution to
    # request time, so a recreated web container is picked up within `valid`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # GO uploads are validated at <=10 MB; allow some headroom.
    client_max_body_size 25M;

    # Report filters submit by GET, so a long MP selection makes a long
    # request line. Keep the buffers above the 8190 gunicorn accepts.
    large_client_header_buffers 4 16k;

    # Collected static files. These filenames are NOT content-hashed (Django
    # 5.1 dropped STATICFILES_STORAGE and the manifest storage cannot be turned
    # back on until the vendored CKEditor source map is sorted out), so they
    # must not be cached blind: `expires 30d` here meant a returning browser
    # kept a month-old copy of any edited CSS or JS and never asked again, so a
    # deploy was invisible until the user hard-refreshed. `no-cache` keeps the
    # copy but revalidates it — a 304 with no body, which costs nothing on a
    # LAN and makes every deploy visible at once.
    location /static/ {
        alias /app/static_collected/;
        access_log off;
        add_header Cache-Control "public, no-cache";
    }

    # User-uploaded media (GO PDFs/images, MP photos).
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        # Via a variable ON PURPOSE — see the resolver note above. With a
        # literal hostname nginx would resolve it once at boot and cache it
        # forever. No URI part after the port, so the original request URI is
        # passed through unchanged, exactly as `proxy_pass http://django` did.
        set $web_upstream web;
        proxy_pass http://$web_upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
